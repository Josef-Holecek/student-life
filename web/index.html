<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one game cabinet column – header, pixel stage, HUD strip, touch pad, story log. Single dark look (night tram, sodium lamps). */
:root {
  --ink: #15121f;
  --panel: #221d33;
  --panel-2: #2c2642;
  --line: #3d3558;
  --paper: #f1eadb;
  --muted: #a99fbf;
  --sodium: #f4b43c;
  --good: #79d38a;
  --bad: #f06b5b;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
.app {
  max-width: 980px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 28px;
  letter-spacing: 0.02em;
  margin: 0;
  color: var(--sodium);
}
.where {
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  min-width: 0;
}
.where b { color: var(--paper); font-weight: 600; }
.clock { color: var(--sodium); }

.stage {
  position: relative;
  border: 3px solid var(--line);
  border-radius: 4px;
  background: #0b0912;
  aspect-ratio: 20 / 12;
  max-width: 100%;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* action menu over the stage */
.menu {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  width: min(420px, calc(100% - 24px));
  background: var(--panel);
  border: 2px solid var(--sodium);
  border-radius: 4px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.45);
  max-height: calc(100% - 24px);
  overflow-y: auto;
}
.menu h2 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 2px;
  color: var(--sodium);
}
.menu p { margin: 0 0 6px; white-space: pre-line; font-size: 14px; }
.menu button, .btn {
  font: inherit;
  font-family: var(--font-display);
  font-size: 15px;
  text-align: left;
  color: var(--paper);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 7px 10px;
  cursor: pointer;
}
.menu button:hover, .menu button:focus-visible, .btn:hover, .btn:focus-visible {
  border-color: var(--sodium);
  outline: none;
  background: #3a3254;
}
.menu button .hint { color: var(--muted); float: right; }
.menu .cancel { color: var(--muted); }

/* start / end card */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(13, 10, 22, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.card {
  max-width: 560px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card h2 {
  font-family: var(--font-display);
  font-size: 26px;
  margin: 0;
  text-wrap: balance;
}
.card h2.win { color: var(--good); }
.card h2.lose { color: var(--bad); }
.card h2.start { color: var(--sodium); }
.card p { margin: 0; white-space: pre-line; }
.card .keys { color: var(--muted); font-size: 14px; }
.card .btn { align-self: flex-start; font-size: 17px; padding: 9px 16px; border-color: var(--sodium); }

/* HUD */
.hud {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px 20px;
  align-items: start;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  align-items: center;
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.stat { display: flex; flex-direction: column; gap: 3px; }
.label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.val { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.energy { display: flex; gap: 2px; align-items: center; }
.energy i {
  display: block;
  width: 6px;
  height: 14px;
  background: var(--line);
  border-radius: 1px;
}
.energy i.on { background: var(--good); }
.energy.low i.on { background: var(--sodium); }
.energy.crit i.on { background: var(--bad); }
.energy span { margin-left: 8px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.bag { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot {
  font: inherit;
  color: var(--paper);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  min-height: 64px;
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  min-width: 0;
}
.slot:hover, .slot:focus-visible { border-color: var(--sodium); outline: none; }
.slot:disabled { cursor: default; opacity: 0.55; }
.slot canvas { width: 32px; height: 32px; }
.slot small {
  font-size: 12px;
  line-height: 1.2;
  text-align: center;
  overflow-wrap: anywhere;
}
.slot kbd { font-family: var(--font-display); font-size: 11px; color: var(--muted); }

/* touch pad */
.pad {
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 52px);
  grid-template-rows: repeat(3, 52px);
  gap: 4px;
}
.pad button {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--paper);
  background: var(--panel-2);
  border: 2px solid var(--line);
  border-radius: 6px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.pad button:active { border-color: var(--sodium); }
.dpad .u { grid-column: 2; grid-row: 1; }
.dpad .l { grid-column: 1; grid-row: 2; }
.dpad .r { grid-column: 3; grid-row: 2; }
.dpad .d { grid-column: 2; grid-row: 3; }
.pad .act { width: 84px; height: 84px; border-radius: 50%; border-color: var(--sodium); color: var(--sodium); }
@media (pointer: coarse) { .pad { display: flex; } }

/* story log */
.log {
  background: var(--panel);
  border-left: 4px solid var(--sodium);
  border-radius: 3px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 92px;
}
.log .msg { white-space: pre-line; max-width: 75ch; }
.log .msg.old { color: var(--muted); font-size: 14px; }
.log .msg b { font-family: var(--font-display); font-weight: 600; color: var(--sodium); }
.log .msg.err { color: var(--bad); }
.log .msg.old.err { color: #b98a86; }

@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .hud { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .slot small { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

// ---------------------------------------------------------------- state
function newState() {
  const items = {};
  for (const id in ROOMS) items[id] = ROOMS[id].items.map(i => ({ ...i }));
  return {
    room: 'pokoj', x: 10, y: 6, dir: 'down',
    energie: 12, penize: 120, kredity: 174, batoh: ['klice'],
    noc: false, oslaveno: false, naucen: false, zkouska: false, slozena: false, diplomVydan: false,
    naramekPredan: false, klicVydan: false, kebabSnezen: false,
    items,
    kontejnery: { skrin: { open: false, obsah: ['skripta', 'isic'] }, lednice: { open: false, obsah: ['horcice'] } },
    over: null, started: false
  };
}
let S = newState();
let log = [];
const anim = { moving: false, fx: 0, fy: 0, t: 0, from: null, step: 0, fade: 0 };

const has = id => S.batoh.includes(id);
const plny = () => S.batoh.length >= KAPACITA;
const take = id => { const i = S.batoh.indexOf(id); if (i >= 0) { S.batoh.splice(i, 1); return true; } return false; };
const room = () => ROOMS[S.room];

// ---------------------------------------------------------------- messages
function say(text, cls) {
  log.unshift({ text, cls: cls || '' });
  log = log.slice(0, 4);
  renderLog();
}
function err(text) { say(text, 'err'); }
function renderLog() {
  const el = document.getElementById('log');
  el.innerHTML = '';
  log.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'msg' + (i ? ' old' : '') + (m.cls ? ' ' + m.cls : '');
    if (m.title) {
      const b = document.createElement('b');
      b.textContent = m.title;
      d.appendChild(b);
      d.appendChild(document.createTextNode('\n'));
    }
    d.appendChild(document.createTextNode(m.text));
    el.appendChild(d);
  });
}
function sayRoom(prefix) {
  const r = room();
  log.unshift({ title: r.name, text: (prefix ? prefix + '\n' : '') + r.desc, cls: '' });
  log = log.slice(0, 4);
  renderLog();
}

// ---------------------------------------------------------------- end of game
function checkEnergy() {
  if (!S.over && S.energie <= 0) {
    end(false, 'Energie ti klesla na nulu. Oči se ti zavřou přímo tady – ' + room().name + '. Probudíš se až druhý den v poledne, bez telefonu, bez důstojnosti a s otiskem podlahy na tváři.', 'KONEC HRY – PROHRA: došla ti energie.');
  }
}
function end(win, text, verdict) {
  S.over = { win, text, verdict };
  closeMenu();
  showEnd();
  updateHud();
}
function energy(d) {
  S.energie = Math.min(MAX_ENERGIE, S.energie + d);
}

// ---------------------------------------------------------------- movement & doors
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function inBounds(x, y, r) { return x >= r.b.x0 && x <= r.b.x1 && y >= r.b.y0 && y <= r.b.y1; }
function exitAt(x, y) { return room().exits.find(e => e.x === x && e.y === y); }
function objsAt(x, y, r = room()) {
  return r.objs.filter(o => x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
}
function npcAt(x, y, r = room()) { return r.npcs.find(n => n.x === x && n.y === y); }
function itemsAt(x, y) { return S.items[S.room].filter(i => i.x === x && i.y === y); }
function solid(x, y) {
  const r = room();
  if (!inBounds(x, y, r)) return true;
  if (objsAt(x, y).some(o => o.solid !== false)) return true;
  if (npcAt(x, y)) return true;
  return false;
}

function tryMove(dir) {
  if (S.over || !S.started || anim.moving || menuOpen()) return;
  S.dir = dir;
  const [dx, dy] = DIRS[dir];
  const nx = S.x + dx, ny = S.y + dy;
  const ex = exitAt(nx, ny);
  if (ex) { go(ex); return; }
  if (solid(nx, ny)) return;
  anim.moving = true; anim.from = [S.x, S.y]; anim.t = 0; anim.step++;
  S.x = nx; S.y = ny;
}

function go(ex) {
  const from = S.room, to = ex.to;
  if (to === 'pokoj' && !has('klice') && !has('nahradni_klic')) return err(T.E4);
  if (to === 'klub' && !has('naramek')) return err(T.E5);
  if (from === 'zastavka_skola' && to === 'vestibul' && S.noc) return err(T.E6);
  const pre = [];
  if (ex.tram) {
    if (!has('jizdenka')) {
      return end(false,
        'Nastoupíš do tramvaje bez jízdenky. Na další zastávce se zvednou dva nenápadní pánové v šusťákovkách: „Přepravní kontrola, jízdenky prosím.“\nPokuta 1 500 Kč. Na účtu máš ' + S.penize + ' Kč. Nezbývá než zavolat domů: „Mami… potřeboval bych…“\nMísto stipendia dostaneš jízdenku domů. Studium končí.',
        'KONEC HRY – PROHRA: chytil tě revizor.');
    }
    take('jizdenka');
    pre.push(S.noc ? T.tramNight : T.tramDay);
  } else {
    energy(S.noc ? -2 : -1);
  }
  if (to === 'pokoj') pre.push(has('klice') ? 'Odemkneš dveře klíčem.' : 'Odemkneš dveře náhradním klíčem. Napoprvé to nejde, napodruhé taky ne, napotřetí ano.');
  if (to === 'klub') pre.push('Vyhazovač se podívá na náramek, pak na tebe, pak zase na náramek. „Dobrý. Běž.“');
  S.zkouska = false;
  S.room = to;
  const back = ROOMS[to].exits.find(e => e.to === from);
  const step = { N: [0, 1, 'down'], S: [0, -1, 'up'], W: [1, 0, 'right'], E: [-1, 0, 'left'] }[back.s];
  S.x = back.x + step[0]; S.y = back.y + step[1]; S.dir = step[2];
  anim.moving = false; anim.fade = 1;
  sayRoom(pre.join('\n'));
  updateHud();
  checkEnergy();
}

// ---------------------------------------------------------------- what is in front of the player
function front() {
  const [dx, dy] = DIRS[S.dir];
  return [S.x + dx, S.y + dy];
}
function targets() {
  const [fx, fy] = front();
  const out = [];
  const add = t => { if (!out.some(o => o.kind === t.kind && o.ref === t.ref)) out.push(t); };
  itemsAt(S.x, S.y).forEach(i => add({ kind: 'item', ref: i }));
  objsAt(S.x, S.y).forEach(o => add({ kind: 'obj', ref: o }));
  const n = npcAt(fx, fy); if (n) add({ kind: 'npc', ref: n });
  const fo = objsAt(fx, fy);
  fo.forEach(o => add({ kind: 'obj', ref: o }));
  itemsAt(fx, fy).forEach(i => add({ kind: 'item', ref: i }));
  if (fo.some(o => o.reach)) {
    const [dx, dy] = DIRS[S.dir];
    const n2 = npcAt(fx + dx, fy + dy); if (n2) add({ kind: 'npc', ref: n2 });
  }
  return out;
}
function targetLabel() {
  const t = targets();
  if (!t.length) return '';
  const top = t.find(x => x.kind === 'npc') || t.find(x => x.kind === 'item') || t[0];
  return cap(NAMES[top.ref.id]) + (t.length > 1 ? ' …' : '');
}

// ---------------------------------------------------------------- actions
function seber(item) {
  if (plny()) return err(T.E9);
  const list = S.items[S.room];
  list.splice(list.indexOf(item), 1);
  S.batoh.push(item.id);
  say('Do batohu sis dal: ' + NAMES[item.id] + '.');
}
function vezmiZ(kont, id) {
  if (plny()) return err(T.E9);
  const k = S.kontejnery[kont];
  k.obsah.splice(k.obsah.indexOf(id), 1);
  S.batoh.push(id);
  say('Do batohu sis dal: ' + NAMES[id] + '.');
}
function otevri(id) {
  const k = S.kontejnery[id];
  k.open = true;
  const obsah = k.obsah.length ? k.obsah.map(i => NAMES[i]).join(', ') : 'nic';
  say(id === 'lednice'
    ? 'Otevřeš lednici. Studené světlo osvítí jedinou věc: ' + obsah + '. Klasika.'
    : 'Otevřeš skříň. Mezi zmuchlaným oblečením a ponožkou bez páru najdeš: ' + obsah + '.');
}
function poloz(id) {
  take(id);
  S.items[S.room].push({ id, x: S.x, y: S.y });
  say('Položil jsi: ' + NAMES[id] + '.');
}
function kup(shop, id) {
  if (id === 'kebab' && has('poukaz')) {
    take('poukaz'); S.batoh.push('kebab');
    return say('Platíš poukazem. Kebabář ho prohlédne proti světlu, pokrčí rameny a podá ti kebab.\nKoupil jsi: kebab (poukaz).');
  }
  const student = id === 'obed' && has('isic');
  const cena = student ? 82 : SHOPS[shop][id];
  if (S.penize < cena) return err('Na „' + NAMES[id] + '“ nemáš. Stojí ' + cena + ' Kč, máš ' + S.penize + ' Kč.');
  if (plny()) return err(T.E9);
  S.penize -= cena; S.batoh.push(id);
  say('Koupil jsi: ' + NAMES[id] + ' (' + cena + ' Kč' + (student ? ', studentská cena s ISIC' : '') + ').');
}
const FOOD = {
  rohlik: [5, 'Sníš rohlík. Suchý, ale tvůj. Energie +5.'],
  energetak: [6, 'Vypiješ energeťák na ex. Srdce ti buší v rytmu techna. Energie +6.'],
  obed: [15, 'Sníš oběd. Myslivec by se styděl, ale tvůj žaludek je vděčný. Energie +15.'],
  kebab: [12, 'Kebab ve tři ráno. Nejlepší jídlo tvého života. Energie +12.'],
  horcice: [-2, 'Vymáčkneš si hořčici přímo do pusy. Proč? Energie −2.']
};
function snez(id) {
  take(id);
  if (id === 'kebab') S.kebabSnezen = true;
  energy(FOOD[id][0]);
  say(FOOD[id][1]);
}
function studuj() {
  if (S.room !== 'studovna') return err(T.E18);
  if (S.naucen) return say('Už to umíš. Víc se ti toho do hlavy nevejde.');
  S.naucen = true; energy(-2);
  say('Otevřeš skripta a ponoříš se do mikroekonomie. Nabídka, poptávka, mezní užitek… Po dvou hodinách to kupodivu začne dávat smysl. Energie −2. Na zkoušku jsi připravený.');
}
function tancuj() {
  if (S.room !== 'klub') return err(T.E24);
  if (S.oslaveno) return say('Nohy už neposlouchají. Na další tanec nemáš sílu ani náladu.');

  const meliKlice = take('klice');
  for (const r in S.items) S.items[r] = S.items[r].filter(i => i.id !== 'klice');

  if (!plny()) { S.batoh.push('poukaz'); poukaz = 'Do batohu přibylo: poukaz.'; }
  else { S.items.klub.push({ id: 'poukaz', x: S.x, y: S.y }); poukaz = 'Poukaz se ti do batohu nevešel a spadl na zem.'; }
  say('Vrhneš se na parket a tančíš jako nikdy předtím – a hlavně jako nikdo předtím. Čas letí a najednou jsou 3:00 ráno.\nDJ tě vyhlásí vítězem soutěže „Nejodvážnější tanečník večera“ a předá ti poukaz na kebab zdarma.\nPři jedné otočce ti ale z kapsy vylétly klíče od pokoje a zmizely v davu. Navždy.\nDiplom je oslavený. Únava na tebe padá: od teď tě každý krok stojí 2 energie. Energie −3.\n' + poukaz + (meliKlice ? ' Z batohu zmizelo: klice.' : ''));
}
function spi() {

function mluv(id) {

      if (S.klicVydan) return say('Vrátná: „Klíč ráno vrátit, ISIC dostanete zpátky. A potichu, lidi spí.“');

      if (S.slozena) return say('Docent: „Už jste to složil. Nepokoušejte štěstí.“');

        if (has('skripta')) return say('Docent: „Skripta nechte za dveřmi, kolego. Tohle není zkouška s taháky.“');

      }

      return say(S.diplomVydan ? 'Referentka: „Diplom máte, tak už jděte. A nepomačkat!“'
        : 'Referentka: „Máte potvrzení o zkoušce? Ne? Tak proč mi tu stojíte? Další!“');

      if (S.naramekPredan) return say('Honza: „Běž do Sklepa, já jen dopiju a dorazím.“ (Nedorazí.)');

      if (plny()) return say('Honza: „Mám pro tebe náramek do Sklepa, ale nemáš ho kam dát. Udělej si v batohu místo.“');
      let t = 'Honza: „Čau! Ty máš diplom?! To se musí oslavit! Jo a… ty mi pořád dlužíš stovku z minulýho tejdne.“\n';
      if (S.penize > 0) {
        t += 'Honza si vezme všechny tvoje peníze (' + S.penize + ' Kč). „No, je to začátek. Tady máš VIP náramek do Sklepa, vyhazovač je můj bratranec.“\n';
        S.penize = 0;

  }
}

  }
  end(false, (spravne ? '„Správně. A proč?“ zeptá se docent. Ticho. Dlouhé ticho.\n' : '') +
    'Docent sundá brýle a pomalu je vyčistí. „Děkuji, to stačí.“ Do indexu ti zapíše F. Došly ti kreditové poukázky. Ze školy tě vyhodí dřív, než stihneš říct „mezní užitek“.',
    'KONEC HRY – PROHRA: vyletěl jsi od zkoušky.');
}

function dej(item, npc) {
  if (npc === 'docent') return say('Docent: „Úplatky neberu.“');
  if (npc === 'referentka' && item === 'potvrzeni') {
    take('potvrzeni'); S.batoh.push('diplom'); S.diplomVydan = true;
    return say('Referentka potvrzení třikrát orazítkuje, dvakrát podepíše a jednou vzdychne. „180 kreditů. Tady je váš diplom. Nepomačkat!“\nDo batohu přibylo: diplom.');
  }
  if (npc === 'vratna' && item === 'isic') {
    if (has('klice')) return say('Vrátná: „A proč? Vždyť klíče máte.“');
    if (plny()) return say('Vrátná: „Náhradní klíč bych vám dala, ale nemáte ho kam dát.“');
    take('isic'); S.batoh.push('nahradni_klic'); S.klicVydan = true;
    return say('Vrátná si ISIC prohlédne, porovná fotku s tvým obličejem a povzdechne si. „No… dejme tomu, že jste to vy.“ Podá ti náhradní klíč.\nDo batohu přibylo: náhradní klíč.');
  }
  err(cap(NAMES[npc]) + ' o „' + NAMES[item] + '“ nestojí.');
}
function prodej(item) {
  if (!S.noc) return say('Kebabář: „Ve dne ne, šéf má všude kamery. Přijď v noci.“');
  if (item !== 'skripta') return say('Kebabář: „Tohle nechci. Beru jen skripta.“');
  take('skripta'); S.penize += 30;
  say('Kebabář skripta prolistuje. „Mikroekonomie? Hoří krásně. Dám ti třicet.“\nProdal jsi: skripta (+30 Kč).');
}

function napoveda() {
  let t;
  if (S.noc && !S.kebabSnezen) t = 'Je noc, nemáš klíče ani peníze a každý krok bolí dvojnásob. Kebabář v noci vykupuje zvláštní věci – a s poukazem tě nakrmí.';
  else if (S.noc && !has('nahradni_klic')) t = 'Domů jedeš jedině s jízdenkou. A vrátná ti náhradní klíč dá jen za zástavu.';
  else if (S.noc) t = 'Už jen dojít do pokoje a zalehnout.';
  else if (has('diplom') && !has('naramek')) t = 'Diplom bez oslavy neplatí. Kamarád Honza sedí v hospodě.';
  else if (has('naramek')) t = 'S náramkem tě do Sklepa pustí. A v klubu se tancuje.';
  else if (S.slozena) t = 'Potvrzení o zkoušce odnes na studijní oddělení.';
  else if (S.naucen) t = 'Jsi připravený. Do učebny si vezmi propisku – skripta ale nech venku.';
  else if (!S.kontejnery.skrin.open) t = 'Než vyrazíš, mrkni do skříně. Bez skript a ISICu dnes nic nedáš.';
  else t = 'Učit se dá jen v klidu studovny a se skripty v batohu. A nezapomeň jíst – hladový mozek nic nepobere.';
  say('Nápověda: ' + t);
}

// runs an action, then refreshes HUD and checks energy (order from the spec: action → energy → win → loss)
function act(fn) {
  return () => {
    closeMenu();
    if (S.over) return;
    fn();
    updateHud();
    checkEnergy();
  };
}

// ---------------------------------------------------------------- menus
const menuEl = document.getElementById('menu');
let menuReturnFocus = null;
function menuOpen() { return !menuEl.hidden; }
function closeMenu() {
  if (menuEl.hidden) return;
  menuEl.hidden = true; menuEl.innerHTML = '';
  if (menuReturnFocus && document.contains(menuReturnFocus)) menuReturnFocus.focus({ preventScroll: true });
  menuReturnFocus = null;
}
function openMenu(title, text, options, cancelLabel) {
  if (S.over) return;
  menuReturnFocus = document.activeElement;
  menuEl.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = title; menuEl.appendChild(h);
  if (text) { const p = document.createElement('p'); p.textContent = text; menuEl.appendChild(p); }
  options.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = o.label;
    if (o.hint) { const s = document.createElement('span'); s.className = 'hint'; s.textContent = o.hint; b.appendChild(s); }
    b.addEventListener('click', o.fn);
    menuEl.appendChild(b);
  });
  const c = document.createElement('button');
  c.type = 'button'; c.className = 'cancel'; c.textContent = cancelLabel || 'Zpět (Esc)';
  c.addEventListener('click', closeMenu);
  menuEl.appendChild(c);
  menuEl.hidden = false;
  const first = menuEl.querySelector('button');
  if (first) first.focus({ preventScroll: true });
}

function shopOptions(shop) {
  return Object.keys(SHOPS[shop]).map(id => {
    let hint = SHOPS[shop][id] + ' Kč';
    if (id === 'obed') hint = has('isic') ? '82 Kč s ISIC' : '149 Kč bez ISIC';
    if (id === 'kebab' && has('poukaz')) hint = 'poukaz';

  });

function interact() {
  if (S.over || !S.started) return;
  if (menuOpen()) return;
  const ts = targets();
  if (!ts.length) return say('Tady nic není. Zkus se postavit čelem k věci nebo postavě.');
  const opts = [];
  ts.forEach(t => {
    const id = t.ref.id, name = cap(NAMES[id]);
    if (t.kind === 'item') {
      opts.push({ label: 'Sebrat: ' + NAMES[id], fn: act(() => seber(t.ref)) });
    } else if (t.kind === 'npc') {
      opts.push({ label: 'Mluvit s: ' + name, fn: act(() => mluv(id)) });
      if (id === 'kebabar') {
        opts.push(...shopOptions('kebabar'));
        opts.push({ label: 'Prodat…', fn: () => { closeMenu(); sellMenu(); } });
      }
      opts.push({ label: 'Dát…', fn: () => { closeMenu(); giveMenu(id); } });
    } else {
      const k = S.kontejnery[id];
      if (k) {
        if (!k.open) opts.push({ label: 'Otevřít: ' + name, fn: act(() => otevri(id)) });
        else if (!k.obsah.length) opts.push({ label: name + ' je prázdná', fn: act(() => say(name + ' je otevřená a prázdná.')) });
        else k.obsah.forEach(c => opts.push({ label: 'Vzít z: ' + name + ' – ' + NAMES[c], fn: act(() => vezmiZ(id, c)) }));
      }
      if (SHOPS[id]) opts.push(...shopOptions(id));
      if (id === 'postel') opts.push({ label: 'Jít spát', fn: act(spi) });
      if (id === 'parket') opts.push({ label: 'Tančit', fn: act(tancuj) });
      if (LOOK[id]) opts.push({ label: 'Prohlédnout: ' + name, fn: act(() => say(LOOK[id])) });
    }
  });
  openMenu(ts.map(t => cap(NAMES[t.ref.id])).filter((v, i, a) => a.indexOf(v) === i).join(' · '), null, opts);
}

function itemMenu(idx) {
  if (S.over || !S.started) return;
  const id = S.batoh[idx];
  if (!id) return;
  closeMenu();
  const opts = [];
  if (FOOD[id]) opts.push({ label: (id === 'energetak' ? 'Vypít' : 'Sníst'), hint: (FOOD[id][0] > 0 ? '+' : '') + FOOD[id][0] + ' energie', fn: act(() => snez(id)) });
  if (id === 'skripta') opts.push({ label: 'Studovat', hint: '−2 energie', fn: act(studuj) });
  opts.push({ label: 'Položit na zem', fn: act(() => poloz(id)) });
  openMenu(cap(NAMES[id]), null, opts);
}

// ---------------------------------------------------------------- input
const held = [];
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (menuOpen()) {
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const bs = [...menuEl.querySelectorAll('button')];
      const i = bs.indexOf(document.activeElement);
      const n = e.key === 'ArrowDown' ? (i + 1) % bs.length : (i - 1 + bs.length) % bs.length;
      bs[n].focus();
    }
    return;
  }
  if (!S.started || S.over) return;
  const d = KEYMAP[e.key];
  if (d) {
    e.preventDefault();
    if (!held.includes(d)) held.push(d);
    if (!e.repeat) tryMove(d);
    return;
  }
  if (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter') {
    if (e.target.closest && e.target.closest('button') && e.key !== 'e' && e.key !== 'E') return;
    e.preventDefault(); interact(); return;
  }
  if (/^[1-5]$/.test(e.key)) { itemMenu(+e.key - 1); return; }
  if (e.key === 'h' || e.key === 'H') { napoveda(); }
});
document.addEventListener('keyup', e => {
  const d = KEYMAP[e.key];
  if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }
});
window.addEventListener('blur', () => { held.length = 0; });

document.querySelectorAll('.dpad button').forEach(b => {
  const d = b.dataset.dir;
  const down = e => { e.preventDefault(); if (!held.includes(d)) held.push(d); tryMove(d); };
  const up = e => { e.preventDefault(); const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
});
document.getElementById('padAct').addEventListener('click', interact);

// ---------------------------------------------------------------- drawing helpers
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let g = ctx;
const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let R = n >> 16, G = (n >> 8) & 255, Bc = n & 255;
  const m = v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)));
  return '#' + ((1 << 24) + (m(R) << 16) + (m(G) << 8) + m(Bc)).toString(16).slice(1);
}

function drawFloor(kind, x, y) {
  const px = x * TILE, py = y * TILE, odd = (x + y) % 2;
  switch (kind) {
    case 'wood':
      r(px, py, 16, 16, '#8a5a3a'); r(px, py + (x % 2 ? 4 : 10), 16, 1, '#734a30'); r(px + (y % 2 ? 5 : 11), py, 1, 16, '#9a6744'); break;
    case 'lino':
      r(px, py, 16, 16, odd ? '#9da3a0' : '#a8ada9'); r(px + 3, py + 5, 2, 1, '#8f9592'); break;
    case 'tile':
      r(px, py, 16, 16, '#d8d3c4'); r(px, py, 16, 1, '#b9b3a3'); r(px, py, 1, 16, '#b9b3a3'); break;
    case 'stone':
      r(px, py, 16, 16, odd ? '#7f8577' : '#888e80'); r(px + 2, py + 2, 12, 12, odd ? '#858b7d' : '#8e9486'); break;
    case 'carpet':
      r(px, py, 16, 16, '#3e5b72'); if (odd) r(px + 7, py + 7, 2, 2, '#4a6a83'); break;
    case 'dark':
      r(px, py, 16, 16, odd ? '#231b33' : '#1d1729'); break;
    case 'pave':
      r(px, py, 16, 16, '#6d6a72'); r(px, py + 15, 16, 1, '#5a5760'); r(px + (y % 2 ? 0 : 8), py, 1, 16, '#5a5760'); break;
  }
}

function drawRoom(rm) {
  const b = rm.b;
  r(0, 0, GW * TILE, GH * TILE, '#0d0b14');
  const out = rm.theme === 'out';
  if (out) {
    // facade across the top, road / rails at the bottom
    const fc = rm.wall;
    r(0, 0, GW * TILE, (b.y0) * TILE, fc);
    for (let x = 0; x < GW; x++) {
      if (x % 3 !== 1) continue;
      const lit = S.noc ? ((x * 7) % 5 < 2) : true;
      r(x * TILE + 2, 6, 12, 14, '#2a2733');
      r(x * TILE + 3, 7, 10, 12, lit ? (S.noc ? '#f4c86a' : '#9fc3d8') : '#2f2b3a');
    }
    r(0, b.y0 * TILE - 3, GW * TILE, 3, shade(fc, -0.35));
    for (let y = b.y0; y <= b.y1; y++) for (let x = 0; x < GW; x++) drawFloor('pave', x, y);
    // road
    r(0, (b.y1 + 1) * TILE, GW * TILE, (GH - b.y1 - 1) * TILE, '#3b3940');
    r(0, (b.y1 + 1) * TILE, GW * TILE, 2, '#8c8890');
    if (rm.rails) {
      const ry = (b.y1 + 1) * TILE + 6;
      r(0, ry, GW * TILE, 2, '#a7a2ad'); r(0, ry + 10, GW * TILE, 2, '#a7a2ad');
      for (let x = 0; x < GW * TILE; x += 6) r(x, ry - 1, 3, 14, '#4b4851');
      r(0, ry, GW * TILE, 2, '#b8b3be'); r(0, ry + 10, GW * TILE, 2, '#b8b3be');
    } else {
      for (let x = 0; x < GW * TILE; x += 24) r(x, (b.y1 + 2) * TILE - 2, 12, 2, '#d8c46a');
    }
  } else {
    // walls around the room
    r((b.x0 - 1) * TILE, (b.y0 - 1) * TILE, (b.x1 - b.x0 + 3) * TILE, (b.y1 - b.y0 + 3) * TILE, shade(rm.wall, -0.45));
    r(b.x0 * TILE, (b.y0 - 1) * TILE, (b.x1 - b.x0 + 1) * TILE, TILE, rm.wall);
    r(b.x0 * TILE, b.y0 * TILE - 3, (b.x1 - b.x0 + 1) * TILE, 3, shade(rm.wall, -0.3));
    r(b.x0 * TILE, (b.y0 - 1) * TILE + 2, (b.x1 - b.x0 + 1) * TILE, 1, shade(rm.wall, 0.15));
    for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) drawFloor(rm.floor, x, y);
  }
  // doors
  rm.exits.forEach(e => drawDoor(rm, e));
}

function drawDoor(rm, e) {
  const px = e.x * TILE, py = e.y * TILE;
  const label = e.tram ? (e.to === 'zastavka_skola' ? 'Tram → Škola' : 'Tram → Blanice') : ROOMS[e.to].short;
  const locked = (e.to === 'pokoj' && !has('klice') && !has('nahradni_klic')) ||
                 (e.to === 'vestibul' && S.room === 'zastavka_skola' && S.noc);
  if (e.tram) {
    r(px - 6, py - 2, 28, 4, '#f4b43c');
    r(px + 6, py - 26, 3, 24, '#d9d4dd');
    r(px + 1, py - 34, 13, 10, '#f4b43c'); r(px + 3, py - 32, 9, 6, '#2a2240');
    r(px + 5, py - 31, 5, 4, '#f4b43c');
  } else if (e.s === 'N') {
    r(px + 1, py, 14, 16, '#2a1f17'); r(px + 2, py + 1, 12, 15, locked ? '#5b2b2b' : '#6e4a2e');
    r(px + 11, py + 8, 2, 2, '#e4c35a');
  } else if (e.s === 'S') {
    r(px + 1, py, 14, 6, '#2a1f17'); r(px + 2, py, 12, 4, '#6e4a2e');
  } else {
    const xx = e.s === 'W' ? px + 10 : px;
    r(xx, py - 2, 6, 20, '#2a1f17'); r(xx + 1, py - 1, 4, 18, '#6e4a2e');
  }
  // label tag
  g.font = '600 6px "Pixelify Sans", monospace';
  const tw = Math.ceil(g.measureText(label).width) + 6;
  let lx = px + 8 - tw / 2, ly;
  if (e.tram) ly = py - 46;
  else if (e.s === 'N') ly = py - 10;
  else if (e.s === 'S') ly = py + 7;
  else { ly = py - 13; lx = e.s === 'W' ? px + 2 : px + 14 - tw; }
  lx = Math.max(1, Math.min(GW * TILE - tw - 1, lx));
  ly = Math.max(1, Math.min(GH * TILE - 10, ly));
  r(lx, ly, tw, 9, 'rgba(13,11,20,0.85)');
  r(lx, ly + 8, tw, 1, '#f4b43c');
  g.fillStyle = '#f1eadb';
  g.textBaseline = 'top';
  g.fillText(label, lx + 3, ly + 1);
}

function drawObj(o) {
  const px = o.x * TILE, py = o.y * TILE, w = o.w * TILE, h = o.h * TILE;
  switch (o.id) {
    case 'postel':
      r(px + 1, py + 1, w - 2, h - 2, '#4a3524'); r(px + 3, py + 3, w - 6, h - 6, '#d9d4e6');
      r(px + 5, py + 4, w - 10, 8, '#ffffff'); r(px + 3, py + 15, w - 6, h - 18, '#5f7fb8');
      r(px + 3, py + 24, w - 6, 2, '#4d6aa0'); break;
    case 'stul': case 'stoly': case 'hstul':
      r(px + 1, py + 3, w - 2, h - 5, '#7a5233'); r(px + 1, py + h - 3, w - 2, 2, '#5a3b25');
      if (o.id === 'stul') { r(px + 6, py + 4, 5, 6, '#e8e1d2'); r(px + 7, py + 5, 3, 2, '#7dbb5a'); r(px + 18, py + 5, 8, 5, '#c7c2b5'); }
      if (o.id === 'hstul') { r(px + 5, py + 4, 4, 6, '#e3a21a'); r(px + 5, py + 4, 4, 2, '#fff7e0'); }
      break;
    case 'skrin': {
      const k = S.kontejnery.skrin;
      r(px + 1, py, w - 2, h, '#5b3c26'); r(px + 3, py + 2, w - 6, h - 3, k.open ? '#2a1d14' : '#7a5234');
      r(px + 15, py + 2, 2, h - 3, '#4a3020');
      if (!k.open) { r(px + 12, py + 14, 2, 3, '#e4c35a'); r(px + 18, py + 14, 2, 3, '#e4c35a'); }
      else { r(px + 5, py + 6, 8, 10, '#5a7fb0'); r(px + 19, py + 6, 8, 12, '#b04a4a'); }
      break;
    }
    case 'lednice': {
      const k = S.kontejnery.lednice;
      r(px + 1, py, w - 2, h, '#c9ced3'); r(px + 2, py + 1, w - 4, h - 2, k.open ? '#eaf6ff' : '#e6eaee');
      r(px + 1, py + 11, w - 2, 1, '#a3a9af'); r(px + 12, py + 4, 2, 5, '#8c9399');
      if (k.open && k.obsah.length) r(px + 5, py + 18, 6, 3, '#e8c21c');
      break;
    }
    case 'nastenka':
      r(px + 2, py + 2, w - 4, h - 4, '#b08a5c'); r(px + 5, py + 4, 10, 7, '#fff6c8'); r(px + 18, py + 5, 9, 6, '#f8d0d0');
      r(px + 7, py + 6, 6, 1, '#c33'); break;
    case 'okenko': case 'prepazka': case 'katedra': case 'kpult': case 'pult': case 'vydej': case 'bar':
      r(px, py + 2, w, h - 2, o.id === 'bar' ? '#3b2a52' : o.id === 'kpult' ? '#8b3a22' : '#6a5b48');
      r(px, py + 2, w, 3, o.id === 'bar' ? '#f06bd0' : '#a99a82');
      if (o.id === 'pult') { r(px + 6, py + 6, 8, 4, '#d9a35b'); r(px + 20, py + 5, 5, 7, '#2b6b3b'); r(px + 21, py + 6, 3, 2, '#9cf0a0'); }
      if (o.id === 'vydej') { for (let i = 0; i < 4; i++) r(px + 6 + i * 22, py + 6, 12, 5, '#c7c2b5'); r(px + 8, py + 7, 6, 3, '#8a5530'); }
      if (o.id === 'kpult') { r(px + 50, py + 5, 18, 6, '#e9d7a8'); }
      if (o.id === 'okenko') { r(px + 50, py + 5, 8, 6, '#3a3a3a'); r(px + 52, py + 6, 4, 2, '#e04a4a'); }
      if (o.id === 'katedra') { r(px + 30, py + 5, 5, 5, '#f1eadb'); r(px + 31, py + 6, 3, 2, '#b07a3a'); }
      break;
    case 'regal':
      r(px, py, w, h, '#5a4b3c'); for (let i = 0; i < w; i += 6) { r(px + i + 1, py + 2, 4, 5, ['#d9a35b', '#2b6b3b', '#c94f4f', '#4f7ac9'][(i / 6) % 4]); r(px + i + 1, py + 9, 4, 5, ['#e8c21c', '#9c5ac9', '#d9a35b', '#2b6b3b'][(i / 6) % 4]); }
      break;
    case 'automat':
      r(px + 2, py - 6, 12, 22, '#2b5d8a'); r(px + 4, py - 3, 8, 6, '#bfe3ff'); r(px + 5, py + 6, 6, 2, '#f4b43c'); r(px + 6, py + 10, 4, 3, '#16324a'); break;
    case 'lavicka':
      r(px, py + 6, w, 4, '#8a5a3a'); r(px, py + 2, w, 3, '#9a6744'); r(px + 2, py + 10, 2, 5, '#3a3a3a'); r(px + w - 4, py + 10, 2, 5, '#3a3a3a');
      r(px + 20, py + 4, 5, 3, '#d9a35b'); break;
    case 'socha':
      r(px + 6, py + 20, 20, 12, '#8a8a86'); r(px + 11, py + 2, 10, 18, '#6b7a55'); r(px + 13, py - 6, 6, 8, '#6b7a55');
      r(px + 20, py + 4, 4, 2, '#4a3524'); break;
    case 'kavovar':
      r(px + 2, py - 4, 12, 20, '#30302f'); r(px + 4, py - 1, 8, 4, '#d94a3a'); r(px + 6, py + 7, 4, 4, '#f1eadb'); break;
    case 'rozpis': case 'tabule': case 'televize':
      if (o.id === 'tabule') { r(px, py + 2, w, h - 4, '#2f4a3a'); r(px + 4, py + 5, 30, 1, '#e8e8e0'); r(px + 4, py + 8, 50, 1, '#e8e8e0'); }
      else if (o.id === 'televize') { r(px + 4, py + 2, w - 8, h - 5, '#151515'); r(px + 6, py + 4, w - 12, h - 9, S.noc ? '#2a3a6a' : '#e8f4ff'); r(px + 10, py + 7, 6, 2, '#b33'); }
      else { r(px + 2, py + 2, w - 4, h - 4, '#f1eadb'); r(px + 4, py + 4, w - 8, 1, '#555'); r(px + 4, py + 7, w - 12, 1, '#555'); }
      break;
    case 'pocitac': case 'lavice':
      r(px + 1, py + 6, w - 2, 8, '#7a6a55'); r(px + 1, py + 13, w - 2, 2, '#5a4b3c');
      if (o.id === 'pocitac') { r(px + 6, py - 4, 14, 10, '#222'); r(px + 7, py - 3, 12, 8, '#7fd0ff'); }
      break;
    case 'razitko':
      r(px + 5, py + 6, 6, 8, '#7a3a22'); r(px + 4, py + 12, 8, 3, '#222'); break;
    case 'lampa':
      r(px + 7, py - 14, 2, 30, '#2c2c34'); r(px + 3, py - 18, 10, 5, '#2c2c34'); r(px + 4, py - 14, 8, 2, S.noc ? '#ffe28a' : '#e9e3c8'); break;
    case 'parket': {
      const t = performance.now() / 300;
      for (let yy = 0; yy < o.h; yy++) for (let xx = 0; xx < o.w; xx++) {
        const on = (xx + yy + Math.floor(t)) % 3;
        r(px + xx * 16, py + yy * 16, 16, 16, ['#5a2e7a', '#2e5a7a', '#7a2e4a'][on]);
        r(px + xx * 16 + 1, py + yy * 16 + 1, 14, 14, ['#6c3a91', '#386c91', '#913a5a'][on]);
      }
      break;
    }
    case 'repro':
      r(px + 1, py, 14, h, '#151515'); r(px + 4, py + 4, 8, 8, '#333'); r(px + 6, py + 6, 4, 4, '#555'); r(px + 4, py + 18, 8, 8, '#333'); break;
    case 'gril':
      r(px + 5, py - 6, 6, 20, '#a85a2a'); r(px + 7, py - 10, 2, 26, '#cfcfcf'); r(px + 4, py - 2, 8, 3, '#c96a32'); break;
  }
}

function drawItem(gg, id, px, py) {
  const old = g; g = gg;
  switch (id) {
    case 'klice': case 'nahradni_klic': {
      const c = id === 'klice' ? '#e4c35a' : '#c9ced3';
      r(px + 3, py + 4, 5, 5, c);
      r(px + 4, py + 5, 3, 3, '#2a2240');
      r(px + 8, py + 6, 6, 2, c); r(px + 11, py + 8, 2, 3, c); r(px + 13, py + 8, 1, 2, c);
      if (id === 'nahradni_klic') r(px + 1, py + 10, 5, 4, '#f06b5b');
      break;
    }
    case 'skripta': r(px + 3, py + 2, 10, 12, '#2d5ea8'); r(px + 4, py + 3, 8, 2, '#f1eadb'); r(px + 12, py + 3, 1, 10, '#f1eadb'); break;
    case 'isic': r(px + 2, py + 4, 12, 8, '#7fc4ec'); r(px + 3, py + 5, 4, 5, '#f1eadb'); r(px + 8, py + 6, 5, 1, '#1d4a6a'); r(px + 8, py + 8, 4, 1, '#1d4a6a'); break;
    case 'horcice': r(px + 5, py + 2, 6, 11, '#e8c21c'); r(px + 6, py + 1, 4, 2, '#b33'); r(px + 6, py + 6, 4, 3, '#b33'); break;
    case 'krabice': r(px + 2, py + 4, 12, 9, '#c9a46a'); r(px + 2, py + 4, 12, 2, '#b08a54'); r(px + 6, py + 7, 4, 4, '#c33'); break;
    case 'rohlik': r(px + 3, py + 7, 10, 4, '#d9a35b'); r(px + 2, py + 8, 2, 2, '#c08840'); r(px + 12, py + 8, 2, 2, '#c08840'); r(px + 5, py + 7, 1, 3, '#b07a3a'); r(px + 9, py + 7, 1, 3, '#b07a3a'); break;
    case 'energetak': r(px + 5, py + 2, 6, 12, '#1e1e2a'); r(px + 5, py + 6, 6, 3, '#7cf05a'); r(px + 6, py + 1, 4, 1, '#bbb'); break;
    case 'jizdenka': r(px + 2, py + 5, 12, 7, '#f4e27a'); r(px + 3, py + 6, 6, 1, '#7a6a2a'); r(px + 3, py + 8, 4, 1, '#7a6a2a'); r(px + 11, py + 6, 2, 5, '#c33'); break;
    case 'obed': r(px + 2, py + 5, 12, 8, '#f1eadb'); r(px + 4, py + 7, 5, 4, '#8a5530'); r(px + 10, py + 7, 3, 3, '#f0e2b0'); break;
    case 'tac': r(px + 1, py + 6, 14, 6, '#8a8f96'); r(px + 2, py + 7, 12, 4, '#a2a7ae'); break;
    case 'propiska': for (let i = 0; i < 9; i++) r(px + 3 + i, py + 12 - i, 2, 2, i < 2 ? '#e4c35a' : '#2d5ea8'); break;
    case 'potvrzeni': r(px + 3, py + 2, 10, 12, '#f1eadb'); r(px + 5, py + 4, 6, 1, '#555'); r(px + 5, py + 6, 5, 1, '#555'); r(px + 8, py + 9, 4, 4, '#c33'); break;
    case 'diplom': r(px + 2, py + 5, 12, 6, '#f6eccc'); r(px + 1, py + 5, 2, 6, '#e0d2a6'); r(px + 13, py + 5, 2, 6, '#e0d2a6'); r(px + 7, py + 4, 2, 9, '#c33'); r(px + 6, py + 12, 4, 2, '#c33'); break;
    case 'naramek': r(px + 3, py + 5, 10, 6, '#f05ac9'); r(px + 5, py + 7, 6, 2, '#2a2240'); r(px + 6, py + 7, 4, 1, '#ffe28a'); break;
    case 'tacek': r(px + 3, py + 3, 10, 10, '#e9e3c8'); r(px + 4, py + 4, 8, 8, '#c94f4f'); r(px + 6, py + 6, 4, 4, '#e9e3c8'); break;
    case 'poukaz': r(px + 2, py + 4, 12, 8, '#79d38a'); r(px + 3, py + 5, 10, 6, '#a9ecb4'); r(px + 6, py + 6, 4, 4, '#8b3a22'); break;
    case 'kebab': r(px + 4, py + 3, 8, 11, '#e9d7a8'); r(px + 5, py + 3, 6, 4, '#8b3a22'); r(px + 5, py + 4, 2, 2, '#7cc04a'); r(px + 8, py + 5, 2, 1, '#e04a3a'); break;
    case 'ubrousek': r(px + 3, py + 4, 10, 9, '#ffffff'); r(px + 3, py + 4, 10, 1, '#dcdcdc'); r(px + 4, py + 8, 8, 1, '#e6e6e6'); break;
  }
  g = old;
}

function drawPerson(px, py, o) {
  const dir = o.dir || 'down';
  const bob = o.walk ? (o.frame % 2) : 0;
  // shadow
  r(px + 3, py + 14, 10, 2, 'rgba(0,0,0,0.3)');
  // legs
  r(px + 5, py + 11, 2, 4 - bob, o.pants); r(px + 9, py + 11, 2, 3 + bob, o.pants);
  r(px + 5, py + 15 - bob, 2, 1, '#1a1a1a'); r(px + 9, py + 14 + bob, 2, 1, '#1a1a1a');
  // body
  const bw = o.big ? 12 : 8, bx = px + 8 - bw / 2;
  r(bx, py + 6, bw, 6, o.shirt);
  if (o.apron) r(bx + 1, py + 7, bw - 2, 5, '#f1eadb');
  r(bx - 1, py + 7, 1, 4, o.skin); r(bx + bw, py + 7, 1, 4, o.skin);
  if (o.bag && dir !== 'down') r(dir === 'up' ? px + 5 : dir === 'left' ? px + 10 : px + 3, py + 6, dir === 'up' ? 6 : 3, 5, '#c94f4f');
  // head
  r(px + 5, py + 1, 6, 6, o.skin);
  r(px + 5, py + 0, 6, 2, o.hair);
  if (dir === 'up') r(px + 5, py + 1, 6, 4, o.hair);
  else if (dir === 'left') { r(px + 8, py + 1, 3, 3, o.hair); r(px + 6, py + 3, 1, 1, '#1a1a1a'); }
  else if (dir === 'right') { r(px + 5, py + 1, 3, 3, o.hair); r(px + 9, py + 3, 1, 1, '#1a1a1a'); }
  else { r(px + 6, py + 3, 1, 1, '#1a1a1a'); r(px + 9, py + 3, 1, 1, '#1a1a1a'); }
  if (o.bun) r(px + 6, py - 2, 4, 3, o.hair);
  if (o.glasses && dir === 'down') { r(px + 5, py + 3, 3, 1, '#222'); r(px + 8, py + 3, 3, 1, '#222'); }
  if (o.shades) r(px + 5, py + 3, 6, 1, '#000');
  if (o.cap) r(px + 4, py, 8, 2, o.cap);
  if (o.mug) { r(px + 12, py + 7, 3, 4, '#e3a21a'); r(px + 12, py + 7, 3, 1, '#fff7e0'); }
}

const LOOKS = {
  vratna: { skin: '#e8b996', hair: '#b8b3be', shirt: '#7b5aa6', pants: '#3a3a4a', bun: true },
  docent: { skin: '#e8b996', hair: '#6b6b6b', shirt: '#5a5a48', pants: '#2c2c2c', glasses: true },
  referentka: { skin: '#e2b08c', hair: '#8a3a2a', shirt: '#c97a8a', pants: '#3a3a4a', bun: true },
  honza: { skin: '#e8b996', hair: '#3a2a1a', shirt: '#3f8a5a', pants: '#2f3f6a', mug: true },
  vyhazovac: { skin: '#c99a76', hair: '#151515', shirt: '#151515', pants: '#151515', big: true, shades: true },
  kebabar: { skin: '#c99a76', hair: '#151515', shirt: '#b03a2a', pants: '#2c2c2c', apron: true, cap: '#f1eadb' }
};
const PLAYER = { skin: '#f0c19c', hair: '#5a3a22', shirt: '#2f6e8e', pants: '#3a3550', bag: true };

// ---------------------------------------------------------------- render loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  // movement tween
  if (anim.moving) {
    anim.t += dt / 130;
    if (anim.t >= 1) { anim.moving = false; anim.t = 0; }
  }
  if (!anim.moving && held.length && S.started && !S.over && !menuOpen()) tryMove(held[held.length - 1]);
  if (anim.fade > 0) anim.fade = Math.max(0, anim.fade - dt / 220);

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g = ctx;
  const rm = room();
  drawRoom(rm);
  // depth-sorted: objects, items, npcs, player
  const list = [];
  rm.objs.forEach(o => list.push({ y: o.solid === false ? -1 : o.y + o.h - 1, draw: () => drawObj(o) }));
  S.items[S.room].forEach(i => list.push({ y: i.y - 0.5, draw: () => drawItem(ctx, i.id, i.x * TILE, i.y * TILE) }));
  rm.npcs.forEach(n => list.push({ y: n.y, draw: () => drawPerson(n.x * TILE, n.y * TILE, LOOKS[n.id]) }));
  let ppx = S.x * TILE, ppy = S.y * TILE;
  if (anim.moving && anim.from) {
    const k = anim.t;
    ppx = (anim.from[0] + (S.x - anim.from[0]) * k) * TILE;
    ppy = (anim.from[1] + (S.y - anim.from[1]) * k) * TILE;
  }
  list.push({ y: S.y + 0.1, draw: () => drawPerson(Math.round(ppx), Math.round(ppy), { ...PLAYER, dir: S.dir, walk: anim.moving, frame: anim.step }) });
  list.sort((a, b) => a.y - b.y).forEach(e => e.draw());

  // night tint with lamp glow
  if (S.noc && rm.theme !== 'club') {
    ctx.fillStyle = 'rgba(14, 16, 58, 0.42)';
    ctx.fillRect(0, 0, GW * TILE, GH * TILE);
    rm.objs.filter(o => o.id === 'lampa').forEach(o => {
      const gr = ctx.createRadialGradient(o.x * TILE + 8, o.y * TILE - 10, 2, o.x * TILE + 8, o.y * TILE - 10, 60);
      gr.addColorStop(0, 'rgba(255, 210, 110, 0.35)'); gr.addColorStop(1, 'rgba(255, 210, 110, 0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, GW * TILE, GH * TILE);
    });
  }
  if (rm.theme === 'club') {
    const t = now / 500;
    ctx.fillStyle = `hsla(${(t * 60) % 360}, 80%, 55%, 0.08)`;
    ctx.fillRect(0, 0, GW * TILE, GH * TILE);
  }

  // room name + target prompt
  ctx.font = '700 8px "Pixelify Sans", monospace';
  ctx.textBaseline = 'top';
  const name = rm.name;
  const nw = ctx.measureText(name).width + 10;
  ctx.fillStyle = 'rgba(13,11,20,0.8)'; ctx.fillRect(4, 4, nw, 13);
  ctx.fillStyle = '#f4b43c'; ctx.fillText(name, 9, 6);
  if (S.started && !S.over && !menuOpen()) {
    const tl = targetLabel();
    if (tl) {
      ctx.font = '600 7px "Pixelify Sans", monospace';
      const txt = 'E · ' + tl;
      const tw = ctx.measureText(txt).width + 10;
      const bx = Math.round(Math.max(2, Math.min(GW * TILE - tw - 2, ppx + 8 - tw / 2)));
      const by = Math.round(ppy - 14 < 2 ? ppy + 18 : ppy - 14);
      ctx.fillStyle = 'rgba(13,11,20,0.88)'; ctx.fillRect(bx, by, tw, 11);
      ctx.fillStyle = '#f4b43c'; ctx.fillRect(bx, by + 10, tw, 1);
      ctx.fillStyle = '#f1eadb'; ctx.fillText(txt, bx + 5, by + 2);
    }
  }
  if (anim.fade > 0) { ctx.fillStyle = `rgba(13,11,20,${anim.fade})`; ctx.fillRect(0, 0, GW * TILE, GH * TILE); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- boot (keeps a running game across page updates)
function start(data) {
  if (data && data.S && data.S.room && ROOMS[data.S.room]) {
    S = data.S; log = data.log || [];
    S.over ? showEnd() : (S.started ? (overlay.hidden = true) : showStart());
  } else {
    showStart();
  }
  renderLog(); updateHud();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S, log })); } catch (e) { /* not in a viewer */ }
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});
})();
</script>
